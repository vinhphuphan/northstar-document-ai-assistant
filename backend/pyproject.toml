[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "pillow==12.3.0",
    "pydantic-settings==2.15.0",
    "pymupdf==1.28.2",
    "pypdf==6.20.0",
    "pytesseract==0.3.13",
    "python-dotenv==1.2.4",
    "uvicorn==0.54.0",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
